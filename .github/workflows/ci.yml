name: Verify and build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Prepare the authorization-only runtime (Electron 44 is lazy)
        run: node node_modules/electron/install.js
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --omit=dev
      - run: npm run pack:cli
      - run: npm run pack:standalone
      - run: npm run verify:standalone
      - run: npm run pack:app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: lms-cli-${{ matrix.os }}
          path: |
            *.tgz
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release-cli/*.tar.gz
            release-cli/*.sha256
