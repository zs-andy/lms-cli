name: Prepare draft release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (e.g. v0.5.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Validate release tag and manifests
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify tag matches package and plugin manifests
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          npm run check:repo
          pkg_version=$(node -p "require('./package.json').version")
          test "$pkg_version" = "${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Prepare the authorization-only runtime (Electron 44 is lazy)
        run: node node_modules/electron/install.js
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --omit=dev
      - run: npm run pack:cli
      - run: npm run pack:standalone
      - run: npm run verify:standalone
      - run: npm run pack:app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: |
            *.tgz
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release-cli/*.tar.gz
            release-cli/*.sha256

  draft-release:
    name: Create draft GitHub Release with SHA256SUMS
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: artifacts
      - name: Collect assets, generate SHA256SUMS.txt, and create draft release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to overwrite existing assets."
            exit 1
          fi
          mkdir -p publish
          while IFS= read -r -d '' file; do
            name=$(basename "$file")
            safe_name=${name// /-}
            test ! -e "publish/$safe_name"
            cp "$file" "publish/$safe_name"
          done < <(find artifacts -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.AppImage' -o -name 'lms-cli-*.tar.gz' \) -print0)
          test -n "$(find publish -name 'lms-cli-*.tar.gz' -print -quit)"
          (cd publish && shopt -s nullglob && assets=(*.dmg *.exe *.AppImage *.tar.gz) && sha256sum -- "${assets[@]}" > SHA256SUMS.txt)
          notes_file="docs/releases/${RELEASE_TAG}.md"
          if [ -f "$notes_file" ]; then
            gh release create "$RELEASE_TAG" publish/* \
              --draft \
              --title "lms-cli ${RELEASE_TAG}" \
              --notes-file "$notes_file"
          else
            gh release create "$RELEASE_TAG" publish/* \
              --draft \
              --title "lms-cli ${RELEASE_TAG}" \
              --generate-notes
          fi
