name: Stale issues and PRs

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          days-before-issue-stale: 60
          days-before-issue-close: 14
          days-before-pr-stale: 45
          days-before-pr-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: pinned,security,roadmap,good first issue,help wanted,platform:new,school-preset,school-compatibility
          exempt-pr-labels: pinned,security,roadmap
          exempt-draft-pr: false
          stale-issue-message: |
            此 Issue 已 60 天未有新进展，将在 14 天后自动关闭。如果问题仍然存在或你希望继续跟进，欢迎直接回复任意内容保持开启。
            This issue has been inactive for 60 days and will be closed in 14 days unless there is new activity. Feel free to comment to keep it open!
          stale-pr-message: |
            此 PR 已 45 天未有更新，将在 14 天后自动关闭。如果仍在推进中，欢迎随时回复或推送新提交。
            This pull request has been inactive for 45 days and will be closed in 14 days unless updated. Comment or push a commit anytime to keep it open!
          close-issue-message: '因长时间无后续活动已自动关闭，如有新信息随时欢迎重新打开。/ Closed due to inactivity; feel free to reopen with new details.'
          close-pr-message: '因长时间无后续更新已自动关闭，准备好后随时欢迎重新打开。/ Closed due to inactivity; feel free to reopen anytime.'
